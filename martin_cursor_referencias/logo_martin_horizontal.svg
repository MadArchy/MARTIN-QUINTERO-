<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="Martín Soldadura Especializada">
  <defs>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#00E5FF" flood-opacity="0.55"/>
    </filter>
    <filter id="pinkGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#FF3B86" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Caja de texto derecha -->
  <rect
    x="148" y="58" width="390" height="104" rx="18" ry="18"
    fill="#000000" stroke="#00E5FF" stroke-width="7"
    filter="url(#cyanGlow)"
  />

  <text
    x="343" y="100"
    text-anchor="middle"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="28"
    font-weight="900"
    letter-spacing="1.5"
    fill="#FF3B86"
    filter="url(#pinkGlow)"
  >SOLDADURA</text>

  <text
    x="343" y="136"
    text-anchor="middle"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="26"
    font-weight="900"
    letter-spacing="0.8"
    fill="#FF3B86"
    filter="url(#pinkGlow)"
  >ESPECIALIZADA</text>

  <!-- Hexágono izquierdo (por encima de la caja) -->
  <polygon
    points="110,18 178,57 178,135 110,174 42,135 42,57"
    fill="#000000"
    stroke="#00E5FF"
    stroke-width="8"
    stroke-linejoin="round"
    filter="url(#cyanGlow)"
  />

  <!-- Letra M estilizada -->
  <path
    d="M58 138
       L58 62
       L78 62
       L110 112
       L142 62
       L162 62
       L162 138
       L144 138
       L144 88
       L118 128
       L102 128
       L76 88
       L76 138
       Z"
    fill="#00E5FF"
    stroke="#FFFFFF"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Banner MARTÍN -->
  <rect x="78" y="118" width="64" height="22" rx="2" fill="#FF3B86"/>
  <text
    x="110" y="134"
    text-anchor="middle"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="12"
    font-weight="900"
    letter-spacing="1.2"
    fill="#FFFFFF"
  >MARTÍN</text>
</svg>
